[project]
name = "ip-watch-bot"
version = "0.2.0"
description = "Checks your public IP address and sends a Telegram notification when it changes"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
ip-watch-bot = "ip_watch_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ip_watch_bot"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.33.0.20260906",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
